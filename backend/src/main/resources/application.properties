spring.application.name=portfolio-api
server.port=${PORT:8080}
# Derrière un reverse proxy (Render, Fly.io…) : utilise X-Forwarded-For pour l'IP du client
server.forward-headers-strategy=framework

portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
portfolio.contact.recipient=${CONTACT_RECIPIENT:}
portfolio.contact.sender=${CONTACT_SENDER:${CONTACT_RECIPIENT:}}
portfolio.contact.max-per-window=5
portfolio.contact.window=1h

# SMTP (Brevo, Gmail avec mot de passe d'application, etc.)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
