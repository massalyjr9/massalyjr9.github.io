# Blueprint Render pour l'API de contact (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: portfolio-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://massalyjr9.github.io
      - key: CONTACT_RECIPIENT
        sync: false
      - key: CONTACT_SENDER
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      # Port 2525 : les ports SMTP standards peuvent être bloqués sur les offres gratuites
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
